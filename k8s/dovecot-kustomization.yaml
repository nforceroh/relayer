apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mail

labels:
  - pairs:
      app: dovecot

resources:
  - deployment.yaml
  - service.yaml
  - serviceaccount.yaml
  - certificate.yaml
  - secrets.yaml
  - DNSEndpoint.yaml
#   - backup-schedule.yaml
  - dovecot-secrets-sealed.yaml

configMapGenerator:
  - name: dovecot-env
    envs:
      - maps/env.txt
  - name: relayer-dovecot-sieve
    files:
      - relayer/91-relayer-sieve.conf
      - relayer/global-before.sieve
      - relayer/relayer-forward.sh

generatorOptions:
  disableNameSuffixHash: true
