<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relayer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>
  <main class="container sidebar-wide">
    <nav>
      <ul><li><strong>Relayer</strong></li></ul>
      <ul>
        <li><small>mail forwarding rules</small></li>
        <li>
          <div class="theme-control">
            <button type="button" class="theme-switch" role="switch" aria-checked="true" aria-label="Dark theme" data-theme-toggle>
              <span class="theme-knob">
                <svg class="theme-sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
                  <circle cx="8" cy="8" r="2.5"/>
                  <path d="M8 1.5v1.3m0 10.4v1.3M1.5 8h1.3m10.4 0h1.3M3.4 3.4l.9.9m7.4 7.4.9.9m0-9.2-.9.9m-7.4 7.4-.9.9"/>
                </svg>
                <svg class="theme-moon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M13.2 9.5A5.6 5.6 0 0 1 6.5 2.8 5.7 5.7 0 1 0 13.2 9.5Z"/>
                </svg>
              </span>
            </button>
          </div>
        </li>
      </ul>
    </nav>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <article style="padding: 0.75rem 1rem; margin-bottom: 1rem; border-left: 4px solid {{ '#d9534f' if category == 'error' else '#2f855a' }};">
            {{ message }}
          </article>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
