name: Cleanup old GHCR images

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview deletions only"
        required: false
        default: "true"

env:
  IMAGE_NAME: ${{ github.event.repository.name }}

jobs:
  cleanup-ghcr:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # delete-only-untagged-versions is deliberately NOT set: every build is
      # tagged with a unique BUILD_DATE, so restricting deletion to untagged
      # versions meant this workflow never removed anything.
      - name: Cleanup old image versions
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true' }}
        uses: actions/delete-package-versions@v5
        with:
          owner: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          package-name: ${{ env.IMAGE_NAME }}
          package-type: container
          min-versions-to-keep: 5

      - name: Dry run summary
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        run: |
          echo "Dry run: no versions deleted."
          echo "Re-run with dry_run=false to keep the newest 5 versions and remove the rest."
